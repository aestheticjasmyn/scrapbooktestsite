<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JASMYN // VAULT_OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0c;
            color: #e5e5e5;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #16121e 0%, #0a0a0c 100%);
        }
        /* Chrome Texture Simulation */
        .chrome-card {
            background: linear-gradient(135deg, rgba(28,28,30,0.9) 0%, rgba(18,18,20,0.95) 100%);
            border: 1px solid;
            border-image: linear-gradient(to bottom right, #6b7280, #111827, #374151) 1;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }
        .spinning {
            animation: spin 4s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 min-h-screen">

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center border-b border-neutral-800 pb-4 mb-8">
        <div class="text-xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-neutral-200 to-neutral-500">
            JASMYN.VAULT // <span id="current-year-view" class="text-cyan-400 font-mono">CORE</span>
        </div>
        <nav class="flex gap-6 font-mono text-xs uppercase tracking-widest">
            <a href="pages/gallery.html" class="hover:text-cyan-400 transition">Gallery</a>
            <a href="pages/kitchen.html" class="hover:text-magenta-400 transition">Pantry</a>
            <a href="pages/arcade.html" class="hover:text-yellow-400 transition">Arcade</a>
        </nav>
    </header>

    <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <section class="chrome-card p-6 flex flex-col gap-3">
            <h2 class="text-sm font-mono uppercase tracking-widest text-neutral-400 border-b border-neutral-800 pb-2 mb-2">// ARCHIVE_INDEX</h2>
            <button onclick="switchYearTheme('2012', '#ff0055', '#3a0014')" class="w-full text-left font-mono p-3 bg-neutral-900 border border-neutral-800 rounded hover:border-pink-500 transition flex justify-between">
                <span>[2012] THE DOODLEBEAR ERA</span> <span class="text-neutral-600">→</span>
            </button>
            <button onclick="switchYearTheme('2016', '#00f0ff', '#00333a')" class="w-full text-left font-mono p-3 bg-neutral-900 border border-neutral-800 rounded hover:border-cyan-500 transition flex justify-between">
                <span>[2016] BRACELET LOOMS</span> <span class="text-neutral-600">→</span>
            </button>
            <button onclick="switchYearTheme('2024', '#ccff00', '#2a3300')" class="w-full text-left font-mono p-3 bg-neutral-900 border border-neutral-800 rounded hover:border-lime-500 transition flex justify-between">
                <span>[2024] INGLEWOOD TOUR</span> <span class="text-neutral-600">→</span>
            </button>
        </section>

        <section id="scrapbook-center" class="chrome-card p-6 md:col-span-1 transition-all duration-500">
            <h2 class="text-sm font-mono uppercase tracking-widest text-neutral-400 border-b border-neutral-800 pb-2 mb-4">// MEMORY_VIEWPORT</h2>
            <div id="scrapbook-content" class="space-y-4">
                <p class="text-sm font-mono text-neutral-500">Select an archive year from the index to populate the scrapbook workspace profile and display specific color schemes.</p>
            </div>
        </section>

        <section class="chrome-card p-6 flex flex-col items-center justify-between">
            <h2 class="text-sm font-mono uppercase tracking-widest text-neutral-400 border-b border-neutral-800 pb-2 w-full text-center mb-4">// AUDIO_DECK</h2>
            
            <div class="relative w-48 h-48 my-4">
                <div id="vinyl-disc" class="spinning paused w-full h-full rounded-full bg-neutral-950 border-4 border-neutral-800 flex items-center justify-center shadow-[0_0_20px_rgba(0,0,0,0.8)]">
                    <div class="w-40 h-40 rounded-full border border-neutral-900 flex items-center justify-center">
                        <div class="w-32 h-32 rounded-full border border-neutral-800 flex items-center justify-center">
                            <div id="vinyl-label" class="w-16 h-16 rounded-full bg-cyan-500 flex items-center justify-center text-[9px] font-black tracking-tighter text-black text-center uppercase p-1">
                                VAULT TRACK
                            </div>
                        </div>
                    </div>
                </div>
                <div id="needle-arm" class="absolute -top-2 right-4 w-4 h-24 bg-neutral-600 origin-top rotate-12 transition-transform duration-500 pointer-events-none"></div>
            </div>

            <div class="w-full space-y-3">
                <div class="text-center">
                    <p id="track-title" class="text-xs font-mono text-cyan-400 uppercase tracking-widest truncate">TRACK DECK IDLE</p>
                </div>
                
                <select id="track-selector" onchange="changeTrack(this.value)" class="w-full bg-neutral-900 text-xs text-neutral-400 font-mono border border-neutral-800 rounded p-2 focus:outline-none focus:border-cyan-500">
                    <option value="">-- SELECT MP3 STREAM --</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Retro Vapor Stream 01</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Y2K Cyber Beat 02</option>
                </select>

                <div class="flex gap-2">
                    <button onclick="toggleAudio(true)" class="flex-1 bg-neutral-900 border border-neutral-700 text-xs font-mono py-2 rounded hover:bg-neutral-800 text-green-400">PLAY</button>
                    <button onclick="toggleAudio(false)" class="flex-1 bg-neutral-900 border border-neutral-700 text-xs font-mono py-2 rounded hover:bg-neutral-800 text-red-400">PAUSE</button>
                </div>
            </div>
        </section>
    </main>

    <audio id="global-player" preload="auto"></audio>

    <script>
        const player = document.getElementById('global-player');
        const vinyl = document.getElementById('vinyl-disc');
        const needle = document.getElementById('needle-arm');

        function changeTrack(url) {
            if(!url) return;
            player.src = url;
            document.getElementById('track-title').innerText = document.getElementById('track-selector').options[document.getElementById('track-selector').selectedIndex].text;
            toggleAudio(true);
        }

        function toggleAudio(play) {
            if(play && player.src) {
                player.play();
                vinyl.classList.remove('paused');
                needle.style.transform = "rotate(35deg)";
            } else {
                player.pause();
                vinyl.classList.add('paused');
                needle.style.transform = "rotate(12deg)";
            }
        }

        function switchYearTheme(year, primaryColor, darkAccent) {
            document.getElementById('current-year-view').innerText = year;
            const container = document.getElementById('scrapbook-center');
            const content = document.getElementById('scrapbook-content');
            
            // Apply customized background palette configurations based on year profile definitions
            container.style.borderColor = primaryColor;
            container.style.boxShadow = `0 0 25px ${darkAccent}`;
            
            // Generate interactive text context inside container
            if(year === '2012') {
                content.innerHTML = `
                    <h3 class="text-xl font-bold uppercase" style="color: ${primaryColor}">The Middle School Vault</h3>
                    <p class="text-sm font-mono text-neutral-300">Dominant colors: Hot Pink and Neon Accents. Toys active: Doodlebear, Fijit Friends.</p>
                    <div class="p-3 bg-black/40 rounded border border-neutral-800 text-xs font-mono text-pink-400">
                        ⚡ Quick Note: Remember playing with Webkinz and writing lock formulas on text pads.
                    </div>
                `;
            } else if (year === '2024') {
                content.innerHTML = `
                    <h3 class="text-xl font-bold uppercase" style="color: ${primaryColor}">Inglewood & Beyond</h3>
                    <p class="text-sm font-mono text-neutral-300">Dominant colors: Acid Lime Green & Dark Slate. Concert tracking setups active.</p>
                    <div class="p-3 bg-black/40 rounded border border-neutral-800 text-xs font-mono text-lime-400">
                        ⚡ Trip Log: Flew out to Inglewood, California for the multi-day tour run. Back-to-back stadium view layouts.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
