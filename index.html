<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ENTER SYSTEM ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .cyber-sigil {
            filter: drop-shadow(0 0 8px rgba(0, 255, 242, 0.6)) drop-shadow(0 0 15px rgba(234, 0, 255, 0.4));
        }
        .chrome-text {
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 45%, #262626 50%, #737373 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen text-white">

    <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
        <svg class="cyber-sigil w-96 h-96" viewBox="0 0 100 100" stroke="cyan" stroke-width="1" fill="none">
            <path d="M50,5 L45,40 L10,25 L40,48 L5,50 L40,52 L10,75 L45,60 L5,95 L50,65 L55,60 L90,75 L60,52 L95,50 L60,48 L90,25 L55,40 Z M50,25 L50,75 M25,50 L75,50" />
            <circle cx="50" cy="50" r="10" stroke="magenta" />
        </svg>
    </div>

    <div class="z-10 bg-neutral-900/80 border border-neutral-700 p-8 rounded-lg shadow-2xl text-center max-w-sm w-full mx-4 backdrop-blur-md">
        <h1 class="text-3xl font-black tracking-widest uppercase mb-6 chrome-text">ACCESS REQUIRED</h1>
        
        <input type="password" id="gatekeeper" placeholder="ENTER KEYWAY..." 
               class="w-full bg-black border border-neutral-600 text-center py-2 text-cyan-400 tracking-widest focus:outline-none focus:border-magenta-500 rounded font-mono mb-4 placeholder-neutral-600">
        
        <button onclick="verifyAccess()" 
                class="w-full bg-gradient-to-r from-cyan-900 to-purple-900 hover:from-cyan-700 hover:to-purple-700 border border-cyan-400 text-cyan-200 py-2 rounded uppercase font-bold tracking-wider transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.4)]">
            Decrypt System
        </button>
        <p id="error-log" class="text-red-500 text-xs mt-3 hidden tracking-wide animate-pulse">!! ACCESS DENIED: INVALID SIGNATURE !!</p>
    </div>

    <script>
        function verifyAccess() {
            const input = document.getElementById('gatekeeper').value;
            // Simple front-end pass check (Change 'stew' to your preferred password)
            if(input === 'stew') {
                localStorage.setItem('cyber_vault_auth', 'granted');
                window.location.href = 'desktop.html';
            } else {
                const err = document.getElementById('error-log');
                err.classList.remove('hidden');
                document.getElementById('gatekeeper').value = '';
            }
        }
    </script>
</body>
</html>
